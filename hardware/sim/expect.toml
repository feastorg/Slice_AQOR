# Expected behaviour of the ORP front end, worked by hand from the schematic.
#
# U2A is a voltage follower on the BNC centre (J2 SIGNAL), so U2A_OUT = Vorp. C10 on its
# output is DNP. U2B is an inverting summer with its + input at GND and C14 across R3:
# U2B_OUT = -(R3/R1) U2A_OUT - (R3/R2) (-5 V) = 2.0 V - (20k/30k) Vorp = 2.0 - 0.6667 Vorp,
# low-passed at f = 1 / (2 pi R3 C14) = 1 / (2 pi 20k 150n) = 53.05 Hz (tau = 3.0 ms).
# R4 (4.7k) carries no current into the ADC, so ORP_IN (A0) = U2B_OUT.
# So +2000 mV reads 0.667 V, 0 mV reads 2.0 V, -2000 mV reads 3.333 V on the Nano's A0
# (0.1365 ADC counts per mV on a 10-bit 0-5 V ADC). The 2.0 V offset scales with |-5V|.
#
# The probe is V3 behind R100 = 100 Mohm. The model's input bias current (JFET gate
# leakage, ~35 pA) drops ~3.5 mV across it, so every ORP_IN reading carries
# +0.6667 * 3.5 = +2.3 mV; the rtols below allow for it. A measure without `expect` is
# printed, not checked.
#
# D2 (BAT54, A0 to GND) is on the bench but excluded from simulation: there is no vendor
# BAT54 model in models/. Across the span ORP_IN stays >= 0.33 V, so D2 is reverse-biased
# and its clamp is not exercised; its leakage is not modelled.
#
# Rail headroom: the SLOJ067 model clamps the output at VC/VE = 2.2 V plus a diode drop
# inside each rail, about +/-3.45 V on +/-5 V. U2B's highest output, 3.333 V at -2000 mV,
# sits just under it. The model does not limit U2A's input common-mode range.

mirrors = ["R1", "R2", "R3", "R4", "C14", "D2", "U201=U2", "U202=U2"]

# DC: V3 (probe EMF) swept -2.5 .. +2.5 V, R100 = 100 Mohm.

# 2.0 - 0.6667 * 0 = 2.0 V
[[measure]]
name = "orp_at_0"
analysis = "dc"
meas = "find v(/orp_in) at=0"
expect = 2.0
rtol = 0.01

# 2.0 - 0.6667 * 1.0 = 1.3333 V
[[measure]]
name = "orp_at_p1000"
analysis = "dc"
meas = "find v(/orp_in) at=1"
expect = 1.3333
rtol = 0.01

# 2.0 - 0.6667 * 2.0 = 0.6667 V, the bottom of the span
[[measure]]
name = "orp_at_p2000"
analysis = "dc"
meas = "find v(/orp_in) at=2"
expect = 0.6667
rtol = 0.01

# 2.0 - 0.6667 * 2.49 = 0.34 V: past the span A0 still stays above 0 V
[[measure]]
name = "orp_at_p2490"
analysis = "dc"
meas = "find v(/orp_in) at=2.49"
expect = 0.34
rtol = 0.02

# 2.0 + 0.6667 * 1.0 = 2.6667 V
[[measure]]
name = "orp_at_m1000"
analysis = "dc"
meas = "find v(/orp_in) at=-1"
expect = 2.6667
rtol = 0.01

# 2.0 + 0.6667 * 2.0 = 3.3333 V, the top of the span
[[measure]]
name = "orp_at_m2000"
analysis = "dc"
meas = "find v(/orp_in) at=-2"
expect = 3.3333
rtol = 0.01

# Follower: U2A_OUT = Vorp = 1.0 V
[[measure]]
name = "u2a_at_p1000"
analysis = "dc"
meas = "find v(/u2a_out) at=1"
expect = 1.0
rtol = 0.01

# No DC drop across R4: U2B_OUT = ORP_IN = 1.3333 V at +1000 mV
[[measure]]
name = "u2b_at_p1000"
analysis = "dc"
meas = "find v(/u2b_out) at=1"
expect = 1.3333
rtol = 0.01

# Informational: the model's output ceiling (by hand 2.0 + 0.6667 * 2.5 = 3.667 V; the
# model clamps near 3.45 V)
[[measure]]
name = "orp_ceiling"
analysis = "dc"
meas = "max v(/orp_in)"

# Informational: the probe EMF at which ORP_IN reaches 3.4 V, where the model's clamp
# starts to bend the line (by hand (2.0 - 3.4) / 0.6667 = -2.1 V)
[[measure]]
name = "orp_clip_emf"
analysis = "dc"
meas = "when v(/orp_in)=3.4"

# Informational: U2A_OUT at 0 V EMF = -Ib * R100, the model's bias current (about -3.5 mV)
[[measure]]
name = "u2a_bias_offset"
analysis = "dc"
meas = "find v(/u2a_out) at=0"

# TRAN: V3 steps 0 -> 1 V at 1 ms.

# Before the step: 2.0 V
[[measure]]
name = "tran_before"
analysis = "tran"
meas = "find v(/orp_in) at=0.9m"
expect = 2.0
rtol = 0.01

# One time constant after the step (tau = R3 C14 = 3.0 ms):
# 2.0 - 0.6667 * (1 - e^-1) = 2.0 - 0.4214 = 1.5786 V
[[measure]]
name = "tran_tau"
analysis = "tran"
meas = "find v(/orp_in) at=4m"
expect = 1.5786
rtol = 0.01

# Settled, 24 ms (8 tau) after the step: 1.3333 V
[[measure]]
name = "tran_settled"
analysis = "tran"
meas = "find v(/orp_in) at=25m"
expect = 1.3333
rtol = 0.01

# Follower peak after the 1 V step: by hand 1.0 V, no overshoot without C10. With C10 it
# was 1.072 V (c1825a1).
[[measure]]
name = "tran_u2a_peak"
analysis = "tran"
meas = "max v(/u2a_out) from=1m to=30m"
expect = 1.0
rtol = 0.01

# Informational: follower ringing left 1 ms after the step (29 mV pp with C10, c1825a1)
[[measure]]
name = "tran_ring_1ms"
analysis = "tran"
meas = "pp v(/u2a_out) from=2m to=2.2m"

# Informational: ORP_IN's lowest point after the step; a first-order low-pass does not
# undershoot, so by hand 1.3333 V
[[measure]]
name = "tran_orp_min"
analysis = "tran"
meas = "min v(/orp_in) from=1m to=30m"

# AC about 0 V EMF.

# |ORP_IN / Vorp| at 1 Hz = (R3/R1) / sqrt(1 + (1/53.05)^2) = 0.6666
[[measure]]
name = "ac_gain_1hz"
analysis = "ac"
meas = "find vm(/orp_in) at=1"
expect = 0.6666
rtol = 0.01

# -3 dB: |ORP_IN / Vorp| = 0.6667 / sqrt(2) = 0.4714 at f = 1 / (2 pi R3 C14) = 53.05 Hz
[[measure]]
name = "ac_f3db"
analysis = "ac"
meas = "when vm(/orp_in)=0.4714 fall=1"
expect = 53.05
rtol = 0.02

# At 1 kHz: 0.6667 / sqrt(1 + (1000/53.05)^2) = 0.03532
[[measure]]
name = "ac_gain_1khz"
analysis = "ac"
meas = "find vm(/orp_in) at=1k"
expect = 0.03532
rtol = 0.02

# Follower peaking: a well-damped follower peaks at no more than 1.5x, so expect 1.0
# +/- 50%. With C10 it peaked 90x at 60 kHz (c1825a1).
[[measure]]
name = "ac_u2a_peak"
analysis = "ac"
meas = "max vm(/u2a_out)"
expect = 1.0
rtol = 0.5
